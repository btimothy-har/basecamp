name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'deploy/**'

permissions:
  contents: read

concurrency:
  group: sg-compute-production-basecamp-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # OAuth clients cannot register nodes under a user identity, so the
          # runner must advertise a tag; tag:vultr-vps is the tailnet's deploy
          # tag (sg-compute carries it) and the one the client is scoped to.
          tags: tag:vultr-vps
      - name: Sync docs assets
        run: bash scripts/sync-docs-assets.sh

      - name: Deploy Docs
        env:
          DEPLOY_SERVICE: basecamp-docs
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash deploy/docs-deploy-service.sh
