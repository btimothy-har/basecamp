name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'deploy/**'

permissions:
  contents: read

concurrency:
  group: sg-compute-production-basecamp-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Runners join as tag:github-actions (the tag the OAuth client is
          # granted and the ACL source allowed to reach the VPS). tag:vultr-vps
          # is the VPS's own tag; advertising it gets the join rejected with
          # "requested tags ... are invalid or not permitted". The tags input
          # is also required: v3 refuses OAuth joins without it.
          tags: tag:github-actions
      - name: Sync docs assets
        run: bash scripts/sync-docs-assets.sh

      - name: Deploy Docs
        env:
          DEPLOY_SERVICE: basecamp-docs
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash deploy/docs-deploy-service.sh
