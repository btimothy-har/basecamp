name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Run Linter
      run: |
        uv run ruff check --no-fix .

    - name: Run Formatter
      run: |
        uv run ruff format --check .

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Install Legacy Extension Dependencies
      run: |
        npm ci

    - name: Install OMP Extension Dependencies
      run: |
        bun install --cwd omp --frozen-lockfile

    - name: Typecheck Legacy Extension
      run: |
        npm run typecheck

    - name: Typecheck OMP Extension
      run: |
        bun run --cwd omp check

    - name: Lint Extensions
      run: |
        npm run lint

    - name: Run Python Tests
      run: |
        uv run pytest

    - name: Run Legacy Extension Tests
      run: |
        npm test

    - name: Run OMP Extension Tests
      run: |
        bun test --cwd omp

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Sync docs assets
      run: bash scripts/sync-docs-assets.sh

    - name: Build docs
      run: |
        uv run --with mkdocs-material mkdocs build --strict
